# Publish this n8n community node to npm using TRUSTED PUBLISHING (OIDC).
#
# WHY CI RATHER THAN `npm publish` FROM A LAPTOP:
# since 1 May 2026 n8n will not verify a community node unless it was published
# from GitHub Actions with npm provenance — a signed attestation, issued by
# GitHub's OIDC infrastructure, tying the tarball to a specific repository,
# commit and workflow run. A local publish cannot produce one, and
# `npx @n8n/scan-community-package` rejects the package without it.
#
# WHY NO NPM_TOKEN SECRET:
# trusted publishing authenticates with a short-lived OIDC token minted per run,
# instead of a long-lived npm token stored as a repository secret. There is no
# credential to leak, no 2FA/OTP prompt to satisfy, and npm generates the
# provenance attestation automatically for a public package from a public repo.
#
# SETUP (once, on npmjs.com — cannot be done from the CLI):
#   Package page -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user : whyparv
#     Repository           : n8n-nodes-slide-synquic
#     Workflow filename    : publish.yml
#   The repository must be PUBLIC and the package published publicly, otherwise
#   npm will not attach provenance.
#
# RELEASE:
#   npm version patch && git push && git push --tags
# ...or run this workflow manually from the Actions tab.

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for provenance: lets the job mint the OIDC token npm uses to
      # verify the build came from this repo. Without it, --provenance fails.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0 AND npm >= 11.5.1.
          # Node 20 ships npm 10.8, which cannot do OIDC and fails the publish
          # step with no useful message — that is what broke the first releases.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Node 22 currently ships npm 10.9, still below the 11.5.1 that trusted
      # publishing needs, so upgrade explicitly rather than relying on whatever
      # the runner image happens to bundle.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Show toolchain versions
        run: node -v && npm -v

      # --ignore-scripts skips native addon builds. n8n-workflow pulls in
      # isolated-vm, a C++ addon that fails to compile on Node 20 — which is
      # what broke this workflow twice at the install step, before build, lint
      # or test ever ran.
      #
      # Safe here because n8n-workflow is a devDependency used only for its
      # TypeScript declarations at compile time; it is a peerDependency at
      # runtime, supplied by the n8n instance that loads this node. Nothing in
      # this package executes it, so nothing needs it compiled.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # n8n's own ruleset. A verified node must pass it, so a failure blocks the
      # release here rather than surfacing in review feedback.
      - name: Lint (eslint-plugin-n8n-nodes-base)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME implies $TAG_VERSION but package.json is $PKG_VERSION"
            exit 1
          fi
          echo "tag and package.json agree on $PKG_VERSION"

      # No NODE_AUTH_TOKEN: trusted publishing supplies short-lived OIDC
      # credentials. --provenance is the default under trusted publishing but is
      # stated explicitly so the intent is visible, and so the run fails loudly
      # rather than silently publishing without an attestation.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
